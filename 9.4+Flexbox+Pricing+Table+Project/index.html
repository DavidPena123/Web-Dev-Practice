<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }
      .pricing-container{
        display: flex;
        height: 100vh; /* Sets height to 100% of the viewport height  (webpage)*/
        justify-content: center;
        gap: 30px;
        align-items: center; /* Centers items vertically but needs height 100% to work*/
      }
      .pricing-plan{
        background-color: rgb(228, 222, 222);
        border-radius: 10%;
        width:370px;
        height: 370px;
        align-content: center;
      }
      .plan-title{
        text-align: center;
        font-weight: bold;
        font-size: 1.5rem;
        margin-bottom: 10px;
      }
      .plan-price{
        text-align: center;
        font-weight: bold;
        font-size: 3rem;
      }
      .plan-features{
        list-style: none;
        text-align: center;
        padding: 0px;
      }
      .plan-button{
        background-color: rgb(252, 108, 5);
        color: white;
        margin-left: 40%;
        width: 20%;
        padding: 10px;
        border-radius: 10px;
        border: none;
      }
      li{
        padding: 10px;
      }
      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container{
          flex-direction:column;
          height: 100%;
          height: 100vh;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
