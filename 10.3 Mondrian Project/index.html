<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */

    .container{
      display: grid;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 20px;
      width: 748px;
      gap: 9px;
      background-color: #000;
    }
    body{
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0;
    }
    .item1{
      background-color: #E72F24;
    }
    .item2{
      background-color: #F0F1EC;
      grid-column-start: 2;
      grid-column-end: 5;
    }
    .item3{
      background-color: #F0F1EC;
      grid-row-start: 2;
      grid-row-end: 4;
    }
    .item4{
      background-color: #F0F1EC;
      grid-area: 2 / 2 /4 / 4;
    }
    .item5{
      background-color: #004592;
      border-bottom: 10px solid black;
    }
    .item6{
      background-color: #F0F1EC;
      grid-row: span 2;
    }
    .item7{
      background-color: #F0F1EC;
    }
    .item8{
      background-color: #F9D01E;
    }
    .item9{
      background-color: #232629;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="container">
    <div class="item1"></div>
    <div class="item2"></div>
    <div class="item3"></div>
    <div class="item4"></div>
    <div class="item5"></div>
    <div class="item6"></div>
    <div class="item7"></div>
    <div class="item8"></div>
    <div class="item9"></div>
   </div>
</body>

</html>
